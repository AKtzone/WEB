<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="50%" style="stop-color:#9333ea"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <filter id="avatarGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="64" cy="64" r="60" fill="#0f0f0f"/>
  
  <circle cx="64" cy="64" r="56" fill="none" stroke="url(#avatarGrad)" stroke-width="2" opacity="0.5"/>
  
  <circle cx="64" cy="64" r="48" fill="none" stroke="url(#avatarGrad)" stroke-width="1" opacity="0.3"/>
  
  <line x1="20" y1="64" x2="108" y2="64" stroke="url(#avatarGrad)" stroke-width="0.5" opacity="0.2"/>
  <line x1="64" y1="20" x2="64" y2="108" stroke="url(#avatarGrad)" stroke-width="0.5" opacity="0.2"/>
  
  <text x="64" y="72" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="url(#avatarGrad)" text-anchor="middle" filter="url(#avatarGlow)">Z</text>
  
  <circle cx="95" cy="35" r="4" fill="#a855f7" opacity="0.8"/>
  <circle cx="30" cy="95" r="3" fill="#ec4899" opacity="0.6"/>
  
  <circle cx="64" cy="64" r="58" fill="none" stroke="url(#avatarGrad)" stroke-width="0.5" opacity="0.2" stroke-dasharray="4 4"/>
</svg>
