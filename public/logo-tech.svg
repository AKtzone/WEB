<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="zoneGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="zoneGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="200" height="200" rx="20" fill="#0f0f0f"/>
  
  <g transform="translate(100, 100)">
    <circle r="85" fill="none" stroke="url(#zoneGrad1)" stroke-width="1" opacity="0.3"/>
    <circle r="70" fill="none" stroke="url(#zoneGrad2)" stroke-width="1" opacity="0.2"/>
    <circle r="55" fill="none" stroke="url(#zoneGrad1)" stroke-width="1" opacity="0.1"/>
    
    <line x1="-85" y1="0" x2="85" y2="0" stroke="url(#zoneGrad1)" stroke-width="0.5" opacity="0.2"/>
    <line x1="0" y1="-85" x2="0" y2="85" stroke="url(#zoneGrad1)" stroke-width="0.5" opacity="0.2"/>
    <line x1="-60" y1="-60" x2="60" y2="60" stroke="url(#zoneGrad2)" stroke-width="0.5" opacity="0.2"/>
    <line x1="60" y1="-60" x2="-60" y2="60" stroke="url(#zoneGrad2)" stroke-width="0.5" opacity="0.2"/>
  </g>
  
  <g transform="translate(50, 60)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#zoneGrad1)" filter="url(#glow)">Z</text>
  </g>
  
  <g transform="translate(100, 100)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#zoneGrad2)" text-anchor="middle">ONE</text>
  </g>
  
  <circle cx="160" cy="40" r="8" fill="#a855f7" opacity="0.6"/>
  <circle cx="30" cy="150" r="5" fill="#ec4899" opacity="0.5"/>
  <circle cx="170" cy="170" r="6" fill="#7c3aed" opacity="0.4"/>
</svg>
